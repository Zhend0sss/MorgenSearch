services:
  postgres:
    image: postgres:16-alpine
    container_name: morgensearch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morgensearch}
      POSTGRES_USER: ${POSTGRES_USER:-morgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morgen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-morgen} -d ${POSTGRES_DB:-morgensearch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: morgensearch-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morgensearch}
      POSTGRES_USER: ${POSTGRES_USER:-morgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morgen}
      DB_HOST: postgres
      DB_PORT: 5432
      LYRICS_SOURCE: ${LYRICS_SOURCE:-lyricsovh}
      AUTO_SYNC_LYRICS: ${AUTO_SYNC_LYRICS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build:
      context: ./bot
    container_name: morgensearch-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: morgensearch-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
